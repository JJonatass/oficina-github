<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina GitHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra de módulos no topo; Teoria = leitura em coluna; Prática = exercício + terminal + painéis do repositório */
  --bg:#f6f8fa; --surface:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0969da; --commit:#1a7f37;
  --warn:#9a6700; --bad:#cf222e; --soft:#eef3f8; --term:#0d1117; --termink:#e6edf3;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--surface:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8;--commit:#3fb950;--warn:#d29922;--bad:#f85149;--soft:#1c2430;--term:#010409;--termink:#e6edf3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--surface:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8;--commit:#3fb950;--warn:#d29922;--bad:#f85149;--soft:#1c2430;--term:#010409;--termink:#e6edf3;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--soft);padding:.1em .35em;border-radius:4px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand svg{flex:none}
.modo{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modo button{border:0;background:transparent;padding:6px 16px;font-weight:600;color:var(--muted)}
.modo button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tema{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tema svg{width:16px;height:16px}
.prog{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.prog .trk{width:120px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog .trk i{display:block;height:100%;background:var(--commit)}
nav.mods{display:flex;gap:6px;padding:0 16px 10px;max-width:1400px;margin:0 auto;overflow-x:auto}
nav.mods button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
nav.mods button b{font-family:var(--mono)}
nav.mods button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
nav.mods .dot{width:8px;height:8px;border-radius:50%}
main{max-width:1400px;margin:0 auto;padding:16px}
/* Teoria */
.teoria{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 32px}
.teoria h2{font-size:28px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.02em}
.teoria .kick{font-family:var(--mono);font-size:13px;color:var(--muted)}
.teoria h3{font-size:17px;margin:26px 0 8px}
.teoria p,.teoria li{max-width:68ch}
.teoria .lead{font-size:17px}
.teoria pre{background:var(--term);color:var(--termink);padding:12px 14px;border-radius:8px;overflow-x:auto;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:14px}
.card b{display:block;margin-bottom:2px}
table.cmd,table.cmp{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
table.cmd td,table.cmp td,table.cmp th{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.cmd td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--accent)}
table.cmp th{background:var(--soft)}
table.cmp td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums}
.fluxo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:10px 0}
.fluxo span{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-weight:600}
.deck{max-width:820px;margin:0 auto;display:grid;gap:12px}
.deck-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.deck-top .kick{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.etapa{font-size:20px;font-weight:700;letter-spacing:-.01em}
.deck-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deck-ctl select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);max-width:260px}
.lnk{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-decoration:underline;cursor:pointer}
.trilho{display:flex;gap:4px}
.trilho button{flex:1;height:6px;border:0;border-radius:3px;background:var(--line);padding:0;cursor:pointer}
.trilho button.feito{background:var(--commit)}.trilho button.atual{background:var(--accent)}
.slide{min-height:360px}
.slide > h2{font-size:24px;margin-bottom:12px}
.deck-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px;border-top:1px solid var(--line)}
.deck-nav .btn{min-width:120px;padding:8px 14px}
.objetivos,.resumo{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0;background:var(--bg)}
.objetivos{border-left:4px solid var(--accent);border-radius:0 10px 10px 0}.resumo{border-left:4px solid var(--commit);border-radius:0 10px 10px 0;margin-top:26px}
.objetivos ul,.resumo ul{margin:6px 0 0;padding-left:20px}.objetivos li,.resumo li{margin:3px 0}
.analogia{border-radius:10px;background:var(--soft);padding:12px 16px;margin:14px 0}.analogia > b:first-child{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.saida{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:12px 0}
.saida-t{background:var(--term);color:#7ee787;font-family:var(--mono);font-size:12.5px;padding:6px 12px}
.sl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:4px 12px;border-top:1px solid var(--line);font-size:13px;align-items:start}
.sl code{background:transparent;padding:0;white-space:pre-wrap;word-break:break-word}.sl span{color:var(--muted)}
.sl span::before{content:"← ";color:var(--accent)}
table.erros{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}table.erros th,table.erros td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}table.erros th{background:var(--soft)}table.erros td:first-child{width:42%}table.erros code{color:var(--bad);background:transparent;padding:0;word-break:break-word}
.quiz{display:grid;gap:8px}.quiz details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}.quiz summary{cursor:pointer;font-weight:500}.quiz details[open] summary{color:var(--accent)}.quiz p{margin:6px 0 0}
.diag{margin:14px 0;overflow-x:auto}.diag svg{width:100%;min-width:520px;height:auto;display:block}.diag figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.diag .dbox rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.diag .dbox.gh rect{stroke:var(--accent)}
.diag .dt{fill:var(--ink);font:600 14px var(--sans)}.diag .ds{fill:var(--muted);font:12px var(--sans)}.diag .dc{fill:var(--accent);font:600 12px var(--mono)}
.diag .darr path{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#seta)}
.diag .dline path{stroke:var(--line);stroke-width:3;fill:none}.diag .dnode circle{fill:var(--commit)}.diag .dnode.alt circle{fill:#8250df}.diag .dnode circle.merge{fill:var(--surface);stroke:var(--commit);stroke-width:3}
dl.glossario{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}dl.glossario dt{font-family:var(--mono);font-weight:600;color:var(--accent)}dl.glossario dd{margin:0}
@media (max-width:600px){dl.glossario{grid-template-columns:1fr}dl.glossario dd{margin-bottom:6px}.sl{grid-template-columns:1fr;gap:0}.sl span::before{content:"↳ "}table.erros td:first-child{width:auto}}
.free{margin-top:22px;border-left:4px solid var(--commit);background:var(--soft);padding:10px 14px;font-size:14px}
.alerta{margin-top:14px;border-left:4px solid var(--bad);background:var(--soft);padding:10px 14px;font-size:14px}
.irpratica{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500;font-size:14px}
.btn.pri{background:var(--commit);border-color:var(--commit);color:#fff}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Prática */
.pratica{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;align-items:start}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:110px;max-height:calc(100vh - 126px);overflow:auto}
.exlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.exlist button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:12.5px}
.exlist button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.exlist button.feito::after{content:" ✓";color:var(--commit)}
.ex h2{font-size:19px;margin:0 0 6px;text-wrap:balance}
.ex .intro{font-size:14px}
.metas{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.metas li{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.metas li i{flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:50%;margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:11px}
.metas li.ok i{background:var(--commit);border-color:var(--commit);color:#fff}
.metas li.ok span{color:var(--muted)}
.exbtns{display:flex;gap:6px;flex-wrap:wrap}
.dicas{margin-top:10px;font-size:13.5px;display:grid;gap:6px}
.dicas div{background:var(--soft);border-radius:6px;padding:7px 10px}
.sol{margin-top:10px;display:grid;gap:4px}
.sol button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.sol button.nota{font-family:var(--sans);font-style:italic}
.confirma{margin-top:10px;border:1px solid var(--bad);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13.5px;background:var(--soft)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.parabens{margin-top:12px;border:1px solid var(--commit);color:var(--commit);border-radius:8px;padding:8px 12px;font-weight:600}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;min-width:0}
.term{background:var(--term);color:var(--termink);border-radius:12px;display:flex;flex-direction:column;height:calc(100vh - 126px);min-height:460px;position:sticky;top:110px;overflow:hidden}
.term .out{flex:1;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word}
.term .out .cmd{color:#7ee787}
.term .out .cmd b{color:#79c0ff;font-weight:400}
.term .out .err{color:#ffa198}
.term .out .info{color:#8b949e}
.term .out .exp{color:#d2a8ff;border-left:2px solid #6e40c9;padding-left:8px;margin:2px 0 8px;font-family:var(--sans);font-size:13px}
.ajuda{padding:0 12px 8px;font-size:13px;color:#c9d1d9;min-height:20px;line-height:1.45}
.ajuda b{color:#d2a8ff;font-weight:600}.ajuda span{color:#8b949e}
.chips .tog{background:#3c1e70;border-color:#6e40c9;color:#e2c5ff;font-family:var(--sans)}
.chips .tog[aria-pressed="false"]{background:#21262d;border-color:#30363d;color:#8b949e}
.glos{margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.glos summary{font-weight:600;font-size:14px;cursor:pointer}
.glos dl{margin:8px 0 0;display:grid;gap:8px}
.glos dt button{border:0;background:var(--soft);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:12.5px;color:var(--accent);text-align:left}
.glos dd{margin:2px 0 0;font-size:13px;color:var(--ink)}
.passo{display:grid;gap:2px}
.passo .num{display:inline-block;min-width:18px;color:var(--muted);margin-right:4px}
.pq2{font-size:12.5px;color:var(--muted);padding:0 4px 4px 26px}
.term form{display:flex;gap:8px;align-items:center;border-top:1px solid #30363d;padding:8px 12px}
.term .pr{font-family:var(--mono);font-size:12.5px;color:#79c0ff;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--termink);font-family:var(--mono);font-size:14px;outline:none}
.chips{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.chips button{flex:none;background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:999px;padding:2px 10px;font-family:var(--mono);font-size:12px}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
.tabs button{flex:none;border:0;background:transparent;padding:9px 14px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:#fd8c73}
.pbody{padding:14px;min-height:300px}
.small{font-size:12.5px;color:var(--muted)}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.area{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.area h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fi{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12.5px;padding:2px 4px;border-radius:4px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.fi:hover{background:var(--soft)}
.fi .st{flex:none;width:16px;text-align:center;font-weight:600;border-radius:3px;font-size:11px}
.st.U{color:var(--commit)} .st.M{color:var(--warn)} .st.A{color:var(--accent)} .st.C{color:#fff;background:var(--bad)} .st.I{color:var(--muted)}
.fi span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.headinfo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;font-family:var(--mono);white-space:nowrap}
.pill.br{border-color:var(--accent);color:var(--accent)}
.pill.head{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.rem{border-color:var(--bad);color:var(--bad)}
.pill.tag{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--commit);color:var(--commit)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.pub{color:var(--muted)}
.graph{overflow-x:auto}
.graph text{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.graph .msg{fill:var(--muted);font-family:var(--sans)}
.editor{border:1px solid var(--warn);border-radius:10px;background:var(--surface);padding:10px;margin-bottom:12px}
.editor textarea{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg)}
.gh-repos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gh-repos button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:13px;font-family:var(--mono)}
.gh-repos button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rhead h3{margin:0;font-size:16px;font-family:var(--mono)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:transparent;padding:6px 10px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:#fd8c73;font-weight:600}
.box{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:120px}
.row .id{font-family:var(--mono);color:var(--muted);font-size:12px}
.form{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);width:100%}
.form textarea{font-family:var(--mono);font-size:13px;min-height:80px}
.form .inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form .inl > *{width:auto}
.set{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
.set:last-child{border-bottom:0}
.set input{margin-top:4px}
.set .pago{font-size:12px;color:var(--warn)}
.filev{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:6px 0 10px;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw}
.pages iframe{width:100%;height:220px;border:1px solid var(--line);border-radius:8px;background:#fff}
/* Módulo 7 */
.m7{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.m7 section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.m7 h2{margin:0 0 8px;font-size:19px}
.calc{display:grid;gap:10px}
.calc label{display:grid;gap:3px;font-size:14px;font-weight:500}
.calc select,.calc input[type=number]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.calc .ck{display:flex;gap:8px;align-items:center;font-weight:400}
.total{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.linhas{font-size:13.5px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.linhas div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line)}
.cen{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.cen h3{margin:0 0 4px;font-size:15px}
.cen .ops{display:grid;gap:5px;margin-top:8px}
.cen .ops button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13.5px}
.cen .ops button.certa{border-color:var(--commit);color:var(--commit);font-weight:600}
.cen .ops button.errada{border-color:var(--bad);color:var(--bad)}
.cen .pq{font-size:13.5px;margin-top:8px;background:var(--soft);border-radius:6px;padding:7px 10px}
@media (max-width:1100px){.sim{grid-template-columns:1fr}.term{position:relative;top:0;height:420px;min-height:0}}
