<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina GitHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra de módulos no topo; Teoria = leitura em coluna; Prática = exercício + terminal + painéis do repositório */
  --bg:#f6f8fa; --surface:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0969da; --commit:#1a7f37;
  --warn:#9a6700; --bad:#cf222e; --soft:#eef3f8; --term:#0d1117; --termink:#e6edf3;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--surface:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8;--commit:#3fb950;--warn:#d29922;--bad:#f85149;--soft:#1c2430;--term:#010409;--termink:#e6edf3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--surface:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8;--commit:#3fb950;--warn:#d29922;--bad:#f85149;--soft:#1c2430;--term:#010409;--termink:#e6edf3;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--soft);padding:.1em .35em;border-radius:4px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand svg{flex:none}
.modo{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modo button{border:0;background:transparent;padding:6px 16px;font-weight:600;color:var(--muted)}
.modo button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tema{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tema svg{width:16px;height:16px}
.prog{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.prog .trk{width:120px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog .trk i{display:block;height:100%;background:var(--commit)}
nav.mods{display:flex;gap:6px;padding:0 16px 10px;max-width:1400px;margin:0 auto;overflow-x:auto}
nav.mods button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
nav.mods button b{font-family:var(--mono)}
nav.mods button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
nav.mods .dot{width:8px;height:8px;border-radius:50%}
main{max-width:1400px;margin:0 auto;padding:16px}
/* Teoria */
.teoria{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 32px}
.teoria h2{font-size:28px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.02em}
.teoria .kick{font-family:var(--mono);font-size:13px;color:var(--muted)}
.teoria h3{font-size:17px;margin:26px 0 8px}
.teoria p,.teoria li{max-width:68ch}
.teoria .lead{font-size:17px}
.teoria pre{background:var(--term);color:var(--termink);padding:12px 14px;border-radius:8px;overflow-x:auto;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:14px}
.card b{display:block;margin-bottom:2px}
table.cmd,table.cmp{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
table.cmd td,table.cmp td,table.cmp th{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.cmd td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--accent)}
table.cmp th{background:var(--soft)}
table.cmp td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums}
.fluxo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:10px 0}
.fluxo span{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-weight:600}
.deck{max-width:820px;margin:0 auto;display:grid;gap:12px}
.deck-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.deck-top .kick{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.etapa{font-size:20px;font-weight:700;letter-spacing:-.01em}
.deck-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deck-ctl select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);max-width:260px}
.expandir{display:inline-flex;align-items:center;gap:6px}.expandir svg{width:15px;height:15px}
body.foco header.top{display:none}
.deck.foco{position:fixed;inset:0;z-index:60;background:var(--bg);max-width:none;margin:0;padding:16px clamp(16px,4vw,48px) 0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.deck.foco .deck-top,.deck.foco .trilho,.deck.foco .deck-nav{width:100%;max-width:1100px;margin:0 auto}
.deck.foco .slide{width:100%;max-width:1100px;margin:0 auto;flex:1;font-size:18px;padding:36px 48px}
.deck.foco .slide > h2{font-size:32px}
.deck.foco .slide p,.deck.foco .slide li{max-width:80ch}
.deck.foco .slide .small{font-size:15px}
.deck.foco .slide table,.deck.foco .card,.deck.foco .sl,.deck.foco .free,.deck.foco .alerta,.deck.foco .fluxo,.deck.foco table.erros{font-size:16px}
.deck.foco .slide pre{font-size:15px}
@media (max-width:600px){.deck.foco .slide{padding:20px 18px;font-size:16px}.deck.foco .slide > h2{font-size:24px}}
.lnk{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-decoration:underline;cursor:pointer}
.trilho{display:flex;gap:4px}
.trilho button{flex:1;height:6px;border:0;border-radius:3px;background:var(--line);padding:0;cursor:pointer}
.trilho button.feito{background:var(--commit)}.trilho button.atual{background:var(--accent)}
.slide{min-height:360px}
.slide > h2{font-size:24px;margin-bottom:12px}
.deck-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px;border-top:1px solid var(--line)}
.deck-nav .btn{min-width:120px;padding:8px 14px}
.objetivos,.resumo{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0;background:var(--bg)}
.objetivos{border-left:4px solid var(--accent);border-radius:0 10px 10px 0}.resumo{border-left:4px solid var(--commit);border-radius:0 10px 10px 0;margin-top:26px}
.objetivos ul,.resumo ul{margin:6px 0 0;padding-left:20px}.objetivos li,.resumo li{margin:3px 0}
.analogia{border-radius:10px;background:var(--soft);padding:12px 16px;margin:14px 0}.analogia > b:first-child{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.saida{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:12px 0}
.saida-t{background:var(--term);color:#7ee787;font-family:var(--mono);font-size:12.5px;padding:6px 12px}
.sl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:4px 12px;border-top:1px solid var(--line);font-size:13px;align-items:start}
.sl code{background:transparent;padding:0;white-space:pre-wrap;word-break:break-word}.sl span{color:var(--muted)}
.sl span::before{content:"← ";color:var(--accent)}
table.erros{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}table.erros th,table.erros td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}table.erros th{background:var(--soft)}table.erros td:first-child{width:42%}table.erros code{color:var(--bad);background:transparent;padding:0;word-break:break-word}
.quiz{display:grid;gap:8px}.quiz details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}.quiz summary{cursor:pointer;font-weight:500}.quiz details[open] summary{color:var(--accent)}.quiz p{margin:6px 0 0}
.diag{margin:14px 0;overflow-x:auto}.diag svg{width:100%;min-width:520px;height:auto;display:block}.diag figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.diag .dbox rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.diag .dbox.gh rect{stroke:var(--accent)}
.diag .dt{fill:var(--ink);font:600 14px var(--sans)}.diag .ds{fill:var(--muted);font:12px var(--sans)}.diag .dc{fill:var(--accent);font:600 12px var(--mono)}
.diag .darr path{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#seta)}
.diag .dline path{stroke:var(--line);stroke-width:3;fill:none}.diag .dnode circle{fill:var(--commit)}.diag .dnode.alt circle{fill:#8250df}.diag .dnode circle.merge{fill:var(--surface);stroke:var(--commit);stroke-width:3}
dl.glossario{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}dl.glossario dt{font-family:var(--mono);font-weight:600;color:var(--accent)}dl.glossario dd{margin:0}
@media (max-width:600px){dl.glossario{grid-template-columns:1fr}dl.glossario dd{margin-bottom:6px}.sl{grid-template-columns:1fr;gap:0}.sl span::before{content:"↳ "}table.erros td:first-child{width:auto}}
.free{margin-top:22px;border-left:4px solid var(--commit);background:var(--soft);padding:10px 14px;font-size:14px}
.alerta{margin-top:14px;border-left:4px solid var(--bad);background:var(--soft);padding:10px 14px;font-size:14px}
.irpratica{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500;font-size:14px}
.btn.pri{background:var(--commit);border-color:var(--commit);color:#fff}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Prática */
.pratica{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;align-items:start}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:110px;max-height:calc(100vh - 126px);overflow:auto}
.exlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.exlist button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:12.5px}
.exlist button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.exlist button.feito::after{content:" ✓";color:var(--commit)}
.ex h2{font-size:19px;margin:0 0 6px;text-wrap:balance}
.ex .intro{font-size:14px}
.metas{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.metas li{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.metas li i{flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:50%;margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:11px}
.metas li.ok i{background:var(--commit);border-color:var(--commit);color:#fff}
.metas li.ok span{color:var(--muted)}
.exbtns{display:flex;gap:6px;flex-wrap:wrap}
.dicas{margin-top:10px;font-size:13.5px;display:grid;gap:6px}
.dicas div{background:var(--soft);border-radius:6px;padding:7px 10px}
.sol{margin-top:10px;display:grid;gap:4px}
.sol button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.sol button.nota{font-family:var(--sans);font-style:italic}
.confirma{margin-top:10px;border:1px solid var(--bad);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13.5px;background:var(--soft)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.parabens{margin-top:12px;border:1px solid var(--commit);color:var(--commit);border-radius:8px;padding:8px 12px;font-weight:600}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;min-width:0}
.term{background:var(--term);color:var(--termink);border-radius:12px;display:flex;flex-direction:column;height:calc(100vh - 126px);min-height:460px;position:sticky;top:110px;overflow:hidden}
.term .out{flex:1;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word}
.term .out .cmd{color:#7ee787}
.term .out .cmd b{color:#79c0ff;font-weight:400}
.term .out .err{color:#ffa198}
.term .out .info{color:#8b949e}
.term .out .exp{color:#d2a8ff;border-left:2px solid #6e40c9;padding-left:8px;margin:2px 0 8px;font-family:var(--sans);font-size:13px}
.ajuda{padding:0 12px 8px;font-size:13px;color:#c9d1d9;min-height:20px;line-height:1.45}
.ajuda b{color:#d2a8ff;font-weight:600}.ajuda span{color:#8b949e}
.chips .tog{background:#3c1e70;border-color:#6e40c9;color:#e2c5ff;font-family:var(--sans)}
.chips .tog[aria-pressed="false"]{background:#21262d;border-color:#30363d;color:#8b949e}
.glos{margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.glos summary{font-weight:600;font-size:14px;cursor:pointer}
.glos dl{margin:8px 0 0;display:grid;gap:8px}
.glos dt button{border:0;background:var(--soft);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:12.5px;color:var(--accent);text-align:left}
.glos dd{margin:2px 0 0;font-size:13px;color:var(--ink)}
.passo{display:grid;gap:2px}
.passo .num{display:inline-block;min-width:18px;color:var(--muted);margin-right:4px}
.pq2{font-size:12.5px;color:var(--muted);padding:0 4px 4px 26px}
.term form{display:flex;gap:8px;align-items:center;border-top:1px solid #30363d;padding:8px 12px}
.term .pr{font-family:var(--mono);font-size:12.5px;color:#79c0ff;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--termink);font-family:var(--mono);font-size:14px;outline:none}
.chips{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.chips button{flex:none;background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:999px;padding:2px 10px;font-family:var(--mono);font-size:12px}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
.tabs button{flex:none;border:0;background:transparent;padding:9px 14px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:#fd8c73}
.pbody{padding:14px;min-height:300px}
.small{font-size:12.5px;color:var(--muted)}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.area{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.area h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fi{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12.5px;padding:2px 4px;border-radius:4px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.fi:hover{background:var(--soft)}
.fi .st{flex:none;width:16px;text-align:center;font-weight:600;border-radius:3px;font-size:11px}
.st.U{color:var(--commit)} .st.M{color:var(--warn)} .st.A{color:var(--accent)} .st.C{color:#fff;background:var(--bad)} .st.I{color:var(--muted)}
.fi span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.headinfo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;font-family:var(--mono);white-space:nowrap}
.pill.br{border-color:var(--accent);color:var(--accent)}
.pill.head{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.rem{border-color:var(--bad);color:var(--bad)}
.pill.tag{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--commit);color:var(--commit)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.pub{color:var(--muted)}
.graph{overflow-x:auto}
.graph text{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.graph .msg{fill:var(--muted);font-family:var(--sans)}
.editor{border:1px solid var(--warn);border-radius:10px;background:var(--surface);padding:10px;margin-bottom:12px}
.editor textarea{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg)}
.gh-repos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gh-repos button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font-size:13px;font-family:var(--mono)}
.gh-repos button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rhead h3{margin:0;font-size:16px;font-family:var(--mono)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:transparent;padding:6px 10px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:#fd8c73;font-weight:600}
.box{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:120px}
.row .id{font-family:var(--mono);color:var(--muted);font-size:12px}
.form{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);width:100%}
.form textarea{font-family:var(--mono);font-size:13px;min-height:80px}
.form .inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form .inl > *{width:auto}
.set{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
.set:last-child{border-bottom:0}
.set input{margin-top:4px}
.set .pago{font-size:12px;color:var(--warn)}
.filev{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:6px 0 10px;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw}
.pages iframe{width:100%;height:220px;border:1px solid var(--line);border-radius:8px;background:#fff}
/* Módulo 7 */
.m7{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.m7 section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.m7 h2{margin:0 0 8px;font-size:19px}
.calc{display:grid;gap:10px}
.calc label{display:grid;gap:3px;font-size:14px;font-weight:500}
.calc select,.calc input[type=number]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.calc .ck{display:flex;gap:8px;align-items:center;font-weight:400}

/* Resumo do que aconteceu depois de rodar (contextual) */
function aconteceu(linha, outs) {
  if (outs.some(o => !o.ok)) return 'O comando não foi concluído. Leia a mensagem em vermelho: o Git quase sempre diz o motivo e o que fazer.';
  const t = tokenize(linha.trim()); const [c, s] = t; const L = W.local;
  if (c !== 'git') return null;
  if (s === 'add' && L) { const n = status(L).staged.length; return n + ' arquivo(s) agora preparado(s). Veja a coluna "Staging" na aba Arquivos.'; }
  if (s === 'commit' && L && headId(L)) return 'Novo commit ' + short(headId(L)) + ' criado no ramo ' + (curBranch(L) || 'atual') + '. Ele está só no seu computador até você fazer git push.';
  if (s === 'push') return 'Agora o GitHub tem os seus commits. Confira na aba GitHub.';
  if ((s === 'switch' || s === 'checkout') && L && curBranch(L)) return 'Você está no ramo ' + curBranch(L) + '. Veja o HEAD no grafo.';
  if (s === 'clone' && L) return 'Pasta ~/' + L.name + ' criada com o projeto. Os próximos comandos já valem dentro dela.';
  if (s === 'init' && L) return 'Repositório pronto. Ainda não há commits: crie arquivos, git add e git commit.';
  return null;
}

/* Glossário: comandos únicos usados numa lista de passos */
function glossario(passos) {
  const vistos = new Map();
  passos.filter(p => typeof p === 'string').forEach(p => {
    const t = tokenize(p); if (!t.length) return;
    let chave = t[0] === 'git' || t[0] === 'gh' ? t.slice(0, t[0] === 'gh' ? 3 : 2).filter(x => !x.startsWith('-') && !/^["']|\//.test(x)).join(' ') : t[0];
    if (t[0] === 'echo') chave = t.includes('>>') ? 'echo "…" >> arquivo' : 'echo "…" > arquivo';
    if (t[0] === 'git' && t[1] === 'commit' && t.includes('--amend')) chave = 'git commit --amend';
    if (t[0] === 'git' && t[1] === 'config') chave = 'git config ' + (t.find(x => /\./.test(x) && !x.startsWith('-')) || '');
    if (t[0] === 'git' && t[1] === 'bisect') chave = 'git bisect ' + (t[2] || '');
    if (t[0] === 'git' && t[1] === 'reset') chave = 'git reset ' + (t.find(x => /^--(soft|hard)$/.test(x)) || '');
    if (t[0] === 'git' && t[1] === 'restore' && t.includes('--staged')) chave = 'git restore --staged';
    if (t[0] === 'git' && t[1] === 'stash' && t[2] === 'pop') chave = 'git stash pop';
    if (t[0] === 'git' && (t[1] === 'switch' || t[1] === 'checkout') && t.some(x => x === '-c' || x === '-b')) chave = 'git ' + t[1] + ' -c';
    if (!vistos.has(chave.trim())) vistos.set(chave.trim(), explicar(p));
  });
  return [...vistos.entries()].filter(([k, v]) => v);
}

<h3>Passo 1: criar a conta</h3>

<li><b>Senha:</b> pelo menos 15 caracteres, ou pelo menos 8 com um número e uma letra minúscula. Não reutilize a senha de outro site.</li>
<li><b>Verificação:</b> o GitHub envia um código para o e-mail. Sem verificar, você não consegue criar repositórios.</li>

<h3>Passo 3: conectar o terminal à sua conta</h3>
<p>São duas configurações <b>diferentes</b>, e as duas são necessárias:</p>
<pre># 1) Quem assina os commits (use o MESMO e-mail da conta)
git config --global user.name "Maria Silva"
git config --global user.email "maria@profjon.com.br"

<div class="card"><b>Fast-forward</b>A main não mudou desde que o ramo foi criado. O Git só "avança a etiqueta" da main até o último commit do ramo. Nenhum commit novo é criado.</div>
<div class="card"><b>Commit de merge</b>Os dois lados andaram. O Git cria um commit especial com <i>dois pais</i>, que junta as duas linhas. Se as duas mudaram a mesma linha, há conflito (Módulo 4).</div>
</div>
<h3>Pull request (PR): pedir para juntar</h3>
<p>Em equipe, ninguém faz merge direto na main. Você envia o seu ramo para o GitHub e abre um <b>pull request</b>, um pedido de "por favor, puxem minhas mudanças para a main". O PR é onde a equipe <b>vê o que mudou, comenta, testa e aprova</b>.</p>
<div class="fluxo"><span>1. git switch -c ramo</span>→<span>2. commits</span>→<span>3. git push -u origin ramo</span>→<span>4. gh pr create</span>→<span>5. revisão</span>→<span>6. merge</span>→<span>7. git switch main e git pull</span></div>
<p>A página de um PR tem:</p>
<table class="cmd">
<tr><td>Conversation</td><td>Descrição, comentários e o resultado das verificações</td></tr>
<tr><td>Commits</td><td>A lista de commits do ramo</td></tr>
<tr><td>Files changed</td><td>O diff: linhas removidas em vermelho e adicionadas em verde. O revisor comenta linha por linha</td></tr>
<tr><td>Checks</td><td>Testes automáticos (Módulo 5)</td></tr>
</table>
<p>Uma boa descrição de PR responde: <b>o que</b> mudou, <b>por que</b>, <b>como testar</b> e qual issue resolve.</p>
<pre>## O que muda
Adiciona o placar no canto superior da tela.

## Como testar
Rode o jogo e faça 3 pontos: o placar deve mostrar 3.

Closes #12</pre>
<p>O revisor pode <b>comentar</b>, <b>aprovar</b> (Approve) ou <b>pedir mudanças</b> (Request changes). Se pedirem mudanças, você faz novos commits no mesmo ramo e dá push: o PR se atualiza sozinho.</p>
<h3>Três formas de mesclar um PR</h3>
<table class="cmp"><tr><th>Botão</th><th>O que faz</th><th>Quando usar</th></tr>

<tr><td>Squash and merge</td><td>Junta todos os commits do ramo em um só</td><td>Ramos com muitos commits pequenos ("wip", "ajuste")</td></tr>
<tr><td>Rebase and merge</td><td>Coloca os commits em linha reta, sem commit de merge</td><td>Quando a equipe prefere histórico linear</td></tr></table>
<h3>Issues: a lista de tarefas do projeto</h3>
<p>Uma <b>issue</b> registra um bug, uma tarefa ou uma ideia. Ela tem título, descrição, comentários, <b>labels</b> (etiquetas como <code>bug</code>, <code>good first issue</code>), <b>assignees</b> (responsáveis) e um número (#12).</p>

<li>O <b>GitHub Projects</b> organiza issues e PRs num quadro Kanban (A fazer, Fazendo, Feito).</li>

<h3>Proteger a main</h3>

<h3>Fork: contribuir com o projeto de outra pessoa</h3>
<p>Num repositório do GitHub, só o <b>dono</b> e os <b>colaboradores</b> convidados podem fazer <code>git push</code>. Se você não é um deles e tenta enviar, recebe "Permissão negada". Então como contribuir com o projeto de outra pessoa, ou com um projeto open source?</p>
<p>A resposta é o <b>fork</b>: uma <b>cópia do repositório de outra pessoa feita para dentro da SUA conta</b> no GitHub. Nessa cópia você tem permissão total. Ela continua "lembrando" de onde veio, e é por isso que dá para propor as suas mudanças de volta ao original com um pull request.</p>
${analogia('É como receber a apostila do professor. Você não pode escrever no original, então tira uma cópia (o fork), faz as suas correções nela e entrega as páginas sugeridas (o pull request). O professor decide se incorpora ao original.')}

<h3>Fork, clone e ramo: três coisas diferentes</h3>
<table class="cmp"><tr><th></th><th>Onde fica</th><th>Para quê</th><th>Comando</th></tr>
<tr><td><b>Fork</b></td><td>Na sua conta do GitHub</td><td>Ter uma cópia sua de um projeto que não é seu</td><td><code>gh repo fork</code> ou botão <i>Fork</i></td></tr>
<tr><td><b>Clone</b></td><td>No seu computador</td><td>Trabalhar nos arquivos localmente</td><td><code>git clone</code></td></tr>
<tr><td><b>Ramo</b></td><td>Dentro de um mesmo repositório</td><td>Separar uma tarefa da main</td><td><code>git switch -c</code></td></tr></table>
<p>Na prática, você usa os três juntos: faz o fork, clona o <i>seu fork</i> e cria um ramo para a tarefa.</p>
<h3>Quando usar colaborador e quando usar fork</h3>
<table class="cmp"><tr><th></th><th>Colaborador</th><th>Fork</th></tr>
<tr><td>Permissão</td><td>Foi convidado e pode fazer push no repositório</td><td>Não tem permissão no original; trabalha na própria cópia</td></tr>

<h3>Passo a passo</h3>
<ol>
<li><b>Fazer o fork.</b> No site: abra o repositório original e clique em <i>Fork</i> (canto superior direito). No terminal: <code>gh repo fork prof/receitas --clone</code>, que já faz o fork, baixa para o PC e configura os remotos.</li>
<li><b>Criar um ramo:</b> <code>git switch -c bolo-de-rolo</code>.</li>
<li><b>Fazer as mudanças</b> e os commits: <code>git add .</code> e <code>git commit -m "Adiciona receita de bolo de rolo"</code>.</li>
<li><b>Enviar para o SEU fork:</b> <code>git push -u origin bolo-de-rolo</code>.</li>
<li><b>Abrir o pull request para o original:</b> <code>gh pr create --title "Receita: bolo de rolo"</code>. No site, o GitHub mostra o botão <i>Compare &amp; pull request</i> no seu fork.</li>

</ol>
<h3>origin e upstream</h3>
<p>Depois do <code>gh repo fork --clone</code>, o seu repositório local tem dois remotos. Confira com <code>git remote -v</code>:</p>
${saida('$ git remote -v', [['origin    https://github.com/aluno/receitas.git', 'O SEU fork: para onde você faz push'], ['upstream  https://github.com/prof/receitas.git', 'O original: de onde você busca novidades']])}
<p>Se você fez o fork pelo site e clonou com <code>git clone</code>, o upstream não existe ainda. Cadastre uma vez: <code>git remote add upstream https://github.com/prof/receitas.git</code>.</p>
<h3>O fork não se atualiza sozinho</h3>
<p>Quando o dono acrescenta coisas no original, o seu fork fica para trás. Antes de começar uma contribuição nova, atualize:</p>
<pre>git switch main
git fetch upstream          # baixa as novidades do original
git merge upstream/main     # junta na sua main local
git push                    # atualiza o seu fork no GitHub</pre>
<p>No site existe o botão <i>Sync fork</i>, e no terminal o <code>gh repo sync</code>, que fazem o mesmo quando você não tem mudanças próprias na main.</p>
<h3>Exemplo na turma</h3>
<p>O professor cria <code>prof/receitas</code> e protege a main. Cada um dos 30 alunos faz o fork, cria um ramo com a sua receita e abre um PR. O professor revisa, comenta e aceita. Ninguém precisa ser colaborador, e ninguém consegue estragar o repositório principal. É exatamente assim que funcionam os grandes projetos open source, como o Flutter e o VS Code.</p>
<h3>Outros usos do fork</h3>
<ul><li><b>Ponto de partida:</b> fazer o fork de um projeto (ou de um template de portfólio) e seguir em outra direção, sem nunca mandar PR.</li>
<li><b>Experimentar sem medo:</b> testar mudanças grandes num projeto alheio sem afetar ninguém.</li></ul>
<div class="alerta"><b>Confusões comuns:</b> mudanças no seu fork <b>não</b> aparecem no original até o PR ser aceito. Apagar o seu fork <b>não</b> afeta o original. E o fork <b>não</b> recebe as novidades do original sozinho: é preciso sincronizar.</div>

<h3>Conflito de merge: não é erro, é uma pergunta</h3>
<p>O Git junta sozinho mudanças em arquivos diferentes, ou em linhas afastadas do mesmo arquivo. Quando duas pessoas mudam <b>a mesma linha</b> (ou linhas vizinhas), ele não tem como saber qual versão é a certa. Então para e pergunta a você. Isso é um conflito.</p>
${saida('titulo.txt durante o conflito', [['&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD', 'Início: a SUA versão'], ['Feira de Tecnologia 2026', ''], ['=======', 'Divisória'], ['Feira de Ciências 2026', 'A versão que veio de fora (colega)'], ['&gt;&gt;&gt;&gt;&gt;&gt;&gt; origin/main', 'Fim do bloco em conflito']])}
<p><b>Passo a passo para resolver:</b></p>
<ol>
<li><code>git status</code> mostra os arquivos em conflito ("modificado por ambos").</li>
<li>Abra cada arquivo e decida o texto final: a sua versão, a do colega ou uma combinação das duas.</li>
<li><b>Apague as três linhas de marcadores</b> (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>).</li>
<li><code>git add arquivo</code> para dizer "resolvido".</li>
<li><code>git commit</code> para concluir o merge, e depois <code>git push</code>.</li>
</ol>
<p>Desistiu no meio? <code>git merge --abort</code> volta tudo para antes. Para ter menos conflitos: faça <code>git pull</code> com frequência, commits pequenos e combine com a equipe quem mexe em qual arquivo.</p>
<h3>Vários pull requests ao mesmo tempo</h3>
<p>Numa equipe, é normal ter vários PRs abertos juntos. O Git não compara o arquivo inteiro: ele compara <b>trecho por trecho</b>, linha a linha. Por isso, na maior parte das vezes, o trabalho de todos é juntado sozinho.</p>
<table class="cmp"><tr><th>Situação</th><th>O que acontece</th></tr>
<tr><td>Cada um mexeu num arquivo diferente</td><td>Tudo entra sozinho, sem conflito</td></tr>
<tr><td>Mesmo arquivo, linhas distantes (ex.: topo e fim)</td><td>Tudo entra sozinho: o Git junta as duas mudanças no mesmo arquivo</td></tr>
<tr><td>Mesmo arquivo, <b>linhas vizinhas</b></td><td>Costuma dar conflito: o Git não tem certeza de que as mudanças combinam</td></tr>
<tr><td>Mesma linha</td><td>Conflito: alguém precisa decidir</td></tr></table>
<p><b>Como acontece na prática</b>, com três PRs abertos (Ana, Bia e Caio):</p>
<ol>
<li>O primeiro PR mesclado entra normalmente. Quem chega primeiro nunca tem conflito.</li>
<li>Cada PR seguinte é comparado com a main <b>já atualizada</b>. Se mexeu em outros lugares, o GitHub mostra <i>This branch has no conflicts</i> e o merge junta tudo.</li>
<li>Se mexeu nas mesmas linhas de algo que já entrou, o PR mostra <i>This branch has conflicts that must be resolved</i> e o botão de merge fica bloqueado. Nada do que já foi mesclado se perde.</li>
<li>O autor do PR em conflito traz a main para o próprio ramo, resolve e envia de novo:</li>
</ol>
<pre>git switch meu-ramo
git pull origin main     # o conflito aparece aqui, só nas linhas disputadas
# edite o arquivo, decida a versão final e apague os marcadores
git add arquivo
git commit
git push                 # o PR se atualiza e o merge é liberado</pre>
<p>Para conflitos simples, o GitHub também tem o botão <i>Resolve conflicts</i>, que abre um editor no navegador. Se três pessoas mexeram na mesma linha, isso acontece duas vezes: o segundo resolve contra o primeiro, e o terceiro contra o resultado dos dois.</p>
<div class="alerta"><b>Sem conflito não quer dizer que funciona.</b> Se a Ana renomeia a função <code>calcular()</code> para <code>somar()</code> e o Caio, em outro arquivo, chama <code>calcular()</code>, o Git junta tudo sem reclamar, porque são linhas diferentes. Mas o programa quebra. É o <i>conflito lógico</i>, e é para pegá-lo que servem os testes automáticos rodando em cada PR (Módulo 5).</div>
<p><b>Para ter menos conflitos:</b> PRs pequenos e mesclados rápido, tarefas divididas por arquivo ou por tela, e <code>git pull origin main</code> no seu ramo antes de abrir o PR.</p>
<h3>Merge ou rebase?</h3>
<p>Os dois integram o trabalho de outro ramo no seu, de jeitos diferentes:</p>
<div class="cards">
<div class="card"><b>merge</b>Junta as duas linhas com um commit de merge. O histórico mostra exatamente o que aconteceu, inclusive o "desvio". É seguro sempre.</div>
<div class="card"><b>rebase</b>Pega os seus commits e os <i>reaplica</i> em cima da ponta do outro ramo, como se você tivesse começado agora. O histórico fica em linha reta, mas seus commits ganham IDs novos.</div>
</div>
<div class="alerta"><b>Regra de ouro:</b> nunca faça rebase de commits que outras pessoas já baixaram. Como o rebase troca os IDs, o histórico dos colegas fica diferente do seu. Use rebase só no seu ramo, antes de abrir o PR.</div>
<h3>Reset: voltar o ramo para trás</h3>
<p>O <code>git reset</code> move a etiqueta do ramo para um commit anterior. A diferença entre os modos é o que acontece com as mudanças dos commits "desfeitos":</p>
<table class="cmp"><tr><th>Modo</th><th>Histórico</th><th>Staging</th><th>Pasta de trabalho</th><th>Uso típico</th></tr>
<tr><td>--soft</td><td>volta</td><td>mantém as mudanças preparadas</td><td>mantém</td><td>Juntar vários commits em um</td></tr>
<tr><td>--mixed (padrão)</td><td>volta</td><td>esvazia</td><td>mantém</td><td>Refazer os commits de outro jeito</td></tr>
<tr><td>--hard</td><td>volta</td><td>esvazia</td><td><b>apaga as mudanças</b></td><td>Jogar tudo fora e voltar a um ponto</td></tr></table>
<p><code>HEAD~1</code> significa "um commit antes do atual"; <code>HEAD~3</code>, três antes.</p>
<h3>Reset ou revert?</h3>
<table class="cmp"><tr><th></th><th>git reset</th><th>git revert</th></tr>
<tr><td>Como desfaz</td><td>Volta o ramo e "esconde" os commits</td><td>Cria um commit NOVO com o contrário das mudanças</td></tr>
<tr><td>Muda o histórico?</td><td>Sim</td><td>Não, só acrescenta</td></tr>
<tr><td>Use quando</td><td>Os commits ainda NÃO foram enviados</td><td>Os commits JÁ estão no GitHub</td></tr></table>
<h3>Ferramentas de resgate</h3>
<div class="cards">
<div class="card"><b>git stash</b>Guarda numa "gaveta" o trabalho que ainda não está pronto e deixa a pasta limpa. Útil quando surge uma urgência. <code>git stash pop</code> traz tudo de volta.</div>
<div class="card"><b>git cherry-pick ID</b>Copia um único commit de outro ramo para o atual. Útil para levar só uma correção, sem o resto do ramo.</div>
<div class="card"><b>git reflog</b>O diário do HEAD: registra cada commit, troca de ramo e reset. Um commit "perdido" por reset aparece aqui, e <code>git reset --hard ID</code> o traz de volta.</div>
</div>
${saida('$ git reflog', [['4b1d2e0 HEAD@{0}: reset: moving to HEAD~2', 'O reset que "apagou" os commits'], ['9e8f7a6 HEAD@{1}: commit: Capítulo 5', 'Aqui está o commit perdido!'], ['c3d4e5f HEAD@{2}: commit: Capítulo 4', '']])}
<p>Recuperar: <code>git reset --hard HEAD@{1}</code> (ou o ID <code>9e8f7a6</code>).</p>
<h3>HEAD destacado</h3>
<p>Se você fizer <code>git switch --detach ID</code> (ou o bisect fizer isso por você), o HEAD aponta direto para um commit, sem ramo. Dá para olhar e testar à vontade. Se quiser guardar o que fizer ali, crie um ramo: <code>git switch -c nome</code>.</p>
<h3>Mantendo um fork atualizado</h3>
<p>O seu fork não se atualiza sozinho quando o original muda. Cadastre o original como <code>upstream</code> e traga as novidades:</p>

git push                                                       # atualiza o fork no GitHub</pre>

<h3>CI/CD: o robô que testa e publica</h3>
<p><b>CI</b> (integração contínua) significa testar o projeto automaticamente a cada mudança. <b>CD</b> (entrega contínua) significa publicar automaticamente o que passou nos testes. No GitHub, quem faz isso é o <b>GitHub Actions</b>: a cada push ou PR, um computador do GitHub baixa o projeto, roda os comandos que você definiu e mostra ✓ ou ✗.</p>
${analogia('É como ter um colega incansável que, a cada entrega, roda todos os testes e avisa na hora se algo quebrou, antes que chegue ao usuário.')}
<h3>Anatomia de um workflow</h3>
<p>Workflows são arquivos <b>YAML</b> na pasta <code>.github/workflows/</code>. No YAML, a <b>indentação (espaços) faz parte da sintaxe</b>: um espaço a mais ou a menos quebra o arquivo.</p>
${saida('.github/workflows/ci.yml', [['name: Testes', 'Nome que aparece na aba Actions'], ['on: [push, pull_request]', 'QUANDO roda: a cada push e a cada PR'], ['jobs:', 'A lista de tarefas'], ['  test:', 'Nome da tarefa'], ['    runs-on: ubuntu-latest', 'Em qual máquina: Linux do GitHub'], ['    steps:', 'Os passos, em ordem'], ['      - uses: actions/checkout@v4', 'Passo pronto: baixa o código do repositório'], ['      - uses: actions/setup-node@v4', 'Passo pronto: instala o Node.js'], ['        with: { node-version: 22 }', 'Configuração do passo'], ['      - run: npm install', 'Comando seu: instala dependências'], ['      - run: npm test', 'Comando seu: roda os testes. Se falhar, o workflow fica ✗']])}
<p>Para Flutter, troque o setup por <code>subosito/flutter-action</code> e os comandos por <code>flutter pub get</code> e <code>flutter test</code>. Os passos prontos (<code>uses</code>) ficam no GitHub Marketplace; confira lá a versão mais recente de cada um.</p>
<h3>Verificações no pull request</h3>
<p>Com <code>pull_request</code> no <code>on</code>, cada PR mostra o resultado do workflow. Na regra de proteção da main dá para marcar <i>exigir que as verificações passem</i>: aí o botão de merge só libera com ✓. Assim nenhum código com teste quebrado chega à main.</p>
<h3>GitHub Pages: site de graça</h3>
<p>O Pages publica um site <b>estático</b> (HTML, CSS, JavaScript, sem servidor) direto do repositório, no endereço <code>usuario.github.io/repositorio</code>.</p>
<ol><li>Settings → Pages.</li><li>Escolha o ramo (geralmente <code>main</code>) e a pasta (raiz ou <code>/docs</code>).</li><li>Em um ou dois minutos o site está no ar. Cada push na main atualiza o site.</li></ol>
<p>Ótimo para portfólio, documentação e projetos web de turma. Um repositório chamado <code>usuario.github.io</code> vira o site principal da sua conta.</p>
<h3>Dependabot: dependências seguras</h3>
<p>Quase todo projeto usa bibliotecas de terceiros (dependências), listadas em arquivos como <code>package.json</code> ou <code>pubspec.yaml</code>. Às vezes descobre-se uma falha de segurança numa versão. O Dependabot faz duas coisas:</p>
<ul><li><b>Alertas:</b> avisa na aba Security quando uma dependência sua tem vulnerabilidade conhecida e diz para qual versão atualizar.</li>
<li><b>Atualizações:</b> abre PRs sozinho atualizando as versões, se você criar o arquivo abaixo.</li></ul>
<pre># .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"     # ou "pub" para Flutter
    directory: "/"
    schedule:
      interval: "weekly"</pre>
<h3>Versões: SemVer, Conventional Commits, tags e releases</h3>
<p>O <b>versionamento semântico</b> usa três números: <b>MAIOR.MENOR.CORREÇÃO</b>.</p>
<table class="cmp"><tr><th>Mudança</th><th>Exemplo</th><th>Versão</th></tr>
<tr><td>Correção de bug, nada muda para quem usa</td><td>fix: corrige cálculo</td><td>1.0.0 → 1.0.1</td></tr>
<tr><td>Funcionalidade nova, sem quebrar o que existia</td><td>feat: adiciona lembretes</td><td>1.0.1 → 1.1.0</td></tr>
<tr><td>Mudança que quebra compatibilidade</td><td>feat!: muda formato da API</td><td>1.1.0 → 2.0.0</td></tr></table>
<p><b>Conventional Commits</b> é a convenção de começar a mensagem com o tipo: <code>feat:</code>, <code>fix:</code>, <code>docs:</code>, <code>ci:</code>, <code>refactor:</code>, <code>test:</code>. Com isso, ferramentas conseguem gerar as notas da versão automaticamente.</p>
<ul><li>Uma <b>tag</b> é uma etiqueta fixa num commit, como <code>v1.0.0</code>. Diferente do ramo, ela não anda.</li>
<li>Uma <b>release</b> é a página da versão no GitHub: título, notas do que mudou e arquivos para baixar (o APK do app, por exemplo).</li></ul>
<pre>git tag v1.0.0
git push origin v1.0.0
gh release create v1.0.0 --generate-notes</pre>

<h3>git bisect: o detetive de bugs</h3>
<p>Algo funcionava há 200 commits e agora não funciona. Testar commit por commit levaria horas. O <b>bisect</b> faz uma <b>busca binária</b>: testa o commit do meio, descarta metade dos suspeitos e repete. Com 200 commits, bastam cerca de 8 testes (2⁸ = 256).</p>
<pre>git bisect start
git bisect bad              # o commit atual tem o bug
git bisect good a1b2c3d     # este commit antigo funcionava
# o Git pula para o meio; você testa e responde:
git bisect good             # ou: git bisect bad
# ... repete até ele dizer "X is the first bad commit"
git bisect reset            # volta para onde estava</pre>
<p>Se existe um teste automático que detecta o bug, o Git faz tudo sozinho: <code>git bisect run npm test</code>.</p>
<h3>Hooks: verificações automáticas no seu PC</h3>
<p>Hooks são scripts na pasta <code>.git/hooks/</code> que o Git executa em certos momentos. O mais usado é o <b>pre-commit</b>, que roda antes de cada commit: se ele terminar com erro, o commit é recusado.</p>
<pre>#!/bin/sh
# .git/hooks/pre-commit (no Git real)
if git diff --cached | grep -q "console.log"; then
  echo "Remova os console.log antes do commit"
  exit 1
fi</pre>
<p>No simulador, a regra é escrita de forma simplificada: <code>proibir console.log</code>. Hooks não vão para o GitHub. Para compartilhar com a equipe, usam-se ferramentas como Husky (JavaScript) ou pre-commit (Python).</p>
<h3>Commits assinados (Verified)</h3>
<p>O <code>user.name</code> é só um texto: qualquer pessoa pode configurar o seu nome e fazer commits "como você". A <b>assinatura</b> usa a sua chave privada para provar que o commit saiu do seu computador. O GitHub mostra o selo <b>Verified</b>.</p>
<pre>git config --global gpg.format ssh
git config --global user.signingkey ~/.ssh/id_ed25519.pub
git config --global commit.gpgsign true
gh ssh-key add ~/.ssh/id_ed25519.pub --type signing</pre>
<h3>Segurança automática (grátis em repositório público)</h3>
<div class="cards">
<div class="card"><b>CodeQL (code scanning)</b>Analisa o código-fonte procurando padrões perigosos: injeção de SQL, uso de <code>eval</code> com dados do usuário, e outros. Os alertas aparecem na aba Security.</div>
<div class="card"><b>Secret scanning e push protection</b>Procuram tokens, chaves e senhas. Com push protection, o push que contém um segredo é bloqueado antes de chegar ao GitHub.</div>
</div>
<h3>Actions avançado</h3>
<pre>jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]        # cria 3 jobs, um por versão, em paralelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: \${{ matrix.node }} }
      - run: npm test</pre>
<ul><li><b>Matriz:</b> testa o mesmo código em várias versões ou sistemas de uma vez.</li>
<li><b>Runner self-hosted:</b> <code>runs-on: self-hosted</code> roda numa máquina sua (do laboratório, por exemplo). Não consome minutos do GitHub.</li>
<li><b>Workflow reutilizável:</b> um workflow com <code>on: workflow_call</code> pode ser chamado por outros repositórios, evitando copiar o mesmo YAML.</li></ul>
<h3>Por dentro do Git</h3>
<p>O Git guarda tudo como <b>objetos</b> na pasta <code>.git</code>, cada um identificado pelo hash do seu conteúdo:</p>
<table class="cmd">
<tr><td>blob</td><td>O conteúdo de um arquivo</td></tr>
<tr><td>tree</td><td>Uma pasta: lista de nomes apontando para blobs e outras trees</td></tr>
<tr><td>commit</td><td>Aponta para uma tree (a "foto"), para o(s) pai(s), autor, data e mensagem</td></tr>
</table>
<p>Como o ID é calculado a partir do conteúdo, mudar qualquer coisa num commit antigo muda o ID dele e o de todos os seguintes. Por isso o histórico é tão confiável, e por isso o rebase gera IDs novos. Veja um commit por dentro com <code>git cat-file -p HEAD</code>.</p>
<h3>Mais duas ferramentas</h3>
<table class="cmd">
<tr><td>git worktree add -b hotfix ../hotfix</td><td>Abre outro ramo em outra pasta ao mesmo tempo. Dá para corrigir um bug sem largar o que você está fazendo</td></tr>
<tr><td>git submodule add URL pasta</td><td>Inclui outro repositório dentro deste, preso numa versão. Quem clona precisa de <code>git submodule update --init</code></td></tr>
<tr><td>gh api repos/dono/repo/commits</td><td>Consulta a API do GitHub e devolve JSON, para relatórios e automações</td></tr>
</table>
${resumo(['bisect acha o commit culpado em poucos passos; bisect run automatiza com um teste.', 'Hooks verificam antes do commit; assinatura prova a autoria (Verified).', 'Em público: CodeQL e push protection de graça.', 'Matriz testa várias versões; self-hosted roda na sua máquina.', 'Commit → tree → blobs, tudo identificado por hash.'])}

function webCreateRepo(name, vis, readme) {

  if (readme) R.branches.main = mkCommit('Initial commit', [], { 'README.md': '# ' + name }, 'Aluno');
  W.flags.add('repo-create:' + full); if (vis === 'private') W.flags.add('created-private:' + full);
  return 'Repositório ' + full + ' criado';
}
function webAddFile(full, name, content, msg) {
  const R = W.gh[full]; if (!name) return 'Informe o nome do arquivo';
  const tip = R.branches[R.def]; const tree = tip ? clone(W.obj[tip].tree) : {};
  if (R.protect && R.visibility === 'public' && tip) return 'A main está protegida: crie um ramo e abra um pull request.';
  tree[name] = content;
  R.branches[R.def] = mkCommit(msg || ((tip && name in W.obj[tip].tree ? 'Update ' : 'Create ') + name), tip ? [tip] : [], tree, 'Aluno', { web: true });

}
function webSet(full, key, val) {

function webSignup(user, email, senha) {
  user = (user || '').trim(); email = (email || '').trim();
  if (!/^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/.test(user)) return 'Nome de usuário inválido: use letras, números e hífens (sem espaços, sem começar ou terminar com hífen, até 39 caracteres).';
  if (RESERVADOS.includes(user.toLowerCase())) return 'O nome "' + user + '" já está em uso. Escolha outro (ex.: seu nome-sobrenome).';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return 'E-mail inválido.';
  if (!(senha.length >= 15 || (senha.length >= 8 && /\d/.test(senha) && /[a-z]/.test(senha)))) return 'Senha fraca: use pelo menos 15 caracteres, ou pelo menos 8 com um número e uma letra minúscula.';
  W.user = user; W.conta = { criada: true, user, email, senha, verificado: false, logado: false, codigo: String(100000 + Math.floor(Math.random() * 900000)), nome: '', bio: '' };
  W.flags.add('signup'); return 'Conta criada! Enviamos um código de verificação para ' + email + '.';
}
function webVerify(code) { if ((code || '').trim() !== W.conta.codigo) return 'Código incorreto. Confira na caixa de entrada.'; W.conta.verificado = true; W.flags.add('verified'); return 'E-mail verificado! Agora entre com seu usuário e senha.'; }
function webLogin(id, senha) {
  const C = W.conta; id = (id || '').trim();
  if ((id !== C.user && id !== C.email) || senha !== C.senha) return 'Usuário ou senha incorretos.';
  C.logado = true; W.flags.add('login'); return 'Bem-vindo, ' + C.user + '!';
}
function webPerfil(nome, bio) { W.conta.nome = (nome || '').trim(); W.conta.bio = (bio || '').trim(); if (W.conta.nome && W.conta.bio) W.flags.add('perfil'); return 'Perfil atualizado'; }
function webLogout() { W.conta.logado = false; W.auth = false; return 'Você saiu da conta.'; }

/* ===== Ajudantes dos exercícios ===== */
function base(o) { W = freshWorld(); W.conta = { criada: true, user: 'aluno', email: 'aluno@profjon.com.br', senha: 'senha-segura-123', verificado: true, logado: true, nome: 'Aluno', bio: '' }; W.gconfig = { 'user.name': 'Aluno', 'user.email': 'aluno@profjon.com.br' }; W.auth = true; W.ghKeys = []; Object.assign(W, o || {}); }
function silent(cmds) { cmds.forEach(c => { run(c); W.cmds.pop(); }); }
function remoteWith(full, commits, opts) { const R = mkRemote(full, opts); if (commits) R.branches.main = mkHistory(commits).pop(); return R; }
const tipOf = full => W.gh[full] && W.gh[full].branches[W.gh[full].def];
const treeOf = full => tipOf(full) ? W.obj[tipOf(full)].tree : {};
const ran = re => W.cmds.some(c => re.test(c));
const fl = f => W.flags.has(f);
const flStart = p => [...W.flags].some(f => f.startsWith(p));
const commitsOn = full => tipOf(full) ? [...ancestors(tipOf(full))].map(x => W.obj[x]) : [];
const mark = () => { W.mark = W.clock; };
const newer = c => c.t > (W.mark || 0);
const noMarkers = t => !Object.values(t).some(v => /^<{7}|^={7}$|^>{7}/m.test(v));

}
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== hashAtual()) rota(); });
document.addEventListener('keydown', e => { if (S.modo !== 'teoria' || S.paginaInteira || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return; if (e.key === 'ArrowRight') irSlide((S.slideMod[S.mod] || 0) + 1); if (e.key === 'ArrowLeft') irSlide((S.slideMod[S.mod] || 0) - 1); });
/* ---------- tela inteira dos cards ---------- */
function setFoco(on) {
  S.foco = on; document.body.classList.toggle('foco', on);
  try {
    if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { });
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => { });
  } catch (e) { }
  if (S.modo === 'teoria') renderTeoria();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.foco) setFoco(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.foco) setFoco(false); });

/* ---------- tema claro/escuro ---------- */
const ICONES = { auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>', claro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', escuro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>' };
const NOMES = { auto: 'Automático', claro: 'Claro', escuro: 'Escuro' };
const temaHost = document.documentElement.getAttribute('data-theme');
let tema = 'auto'; try { tema = localStorage.getItem('oficina-github-tema') || 'auto'; } catch (e) { }
function aplicarTema() {
  const r = document.documentElement;
  if (tema === 'claro') r.setAttribute('data-theme', 'light');
  else if (tema === 'escuro') r.setAttribute('data-theme', 'dark');
  else if (temaHost) r.setAttribute('data-theme', temaHost); else r.removeAttribute('data-theme');
  const b = $('#bTema'); b.innerHTML = ICONES[tema] + NOMES[tema]; b.title = 'Tema: ' + NOMES[tema] + ' (toque para trocar)';
  b.setAttribute('aria-label', 'Tema: ' + NOMES[tema] + '. Toque para trocar');
}
$('#bTema').onclick = () => { tema = { auto: 'claro', claro: 'escuro', escuro: 'auto' }[tema]; try { localStorage.setItem('oficina-github-tema', tema); } catch (e) { } aplicarTema(); toast('Tema: ' + NOMES[tema] + (tema === 'auto' ? ' (segue o sistema)' : '')); };
aplicarTema();
base(); rota();

</script>
